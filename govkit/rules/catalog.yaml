  kb: [KB_08]
  check: {kind: plugin, name: quality.severity_action}
  remediation: "Reglas críticas → bloquear_pipeline / bloquear_promocion; reglas bajas no bloquean."

- id: GOV-QLT-010
  title: Quality gates Silver, Gold y Serving
  nature: D
  category: calidad
  pillar: data_quality
  severity: HIGH
  technique: schema
  enforcement: [pr, gate]
  stages: {ideacion: "OFF", diseno: LOW, salida: "OFF"}
  requires: {artifact: quality_rules}
  source: {doc: 08-data-quality-framework.md, section: "§14", quote: "Los quality gates son obligatorios para todo productos de datos de negocio, como Pricing, Supply, Finance, Customer, y ... AI o decisiones ejecutivas."}
  kb: [KB_08]
  check: {kind: plugin, name: quality.gates}
  remediation: "Declarar spec.gates.{silver,gold,serving} con criterio de aprobación (bloqueante o no)."

- id: GOV-QLT-011
  title: Operación de alertas de calidad
  nature: D
  category: calidad
  pillar: data_quality
  severity: HIGH
  technique: schema
  enforcement: [pr, gate]
  stages: {ideacion: "OFF", diseno: LOW, desarrollo: MEDIUM, salida: "OFF"}
  source: {doc: 08-data-quality-framework.md, section: "§26 Operación", quote: "Responsable de alertas · Canal de notificación · Acción ante incumplimiento crítico"}
  kb: [KB_08, KB_17]
  check:
    kind: field
    target: quality_rules
    fields:
      spec.alerting.owner: {not_placeholder: true}
      spec.alerting.channel: {not_placeholder: true}
      spec.alerting.critical_action: {not_placeholder: true}
  remediation: "Declarar spec.alerting.owner, channel y critical_action."

- id: GOV-QLT-012
  title: Objeto de la regla resoluble contra contratos
  nature: D
  category: calidad
  pillar: data_quality
  severity: MEDIUM
  technique: graph
  enforcement: [pr]
  requires: {artifact: quality_rules}
  source: {doc: 08-data-quality-framework.md, section: "§12", quote: "Dataset / entidad / campo"}
  kb: [KB_08, KB_05]
  check: {kind: plugin, name: quality.object_resolves}
  remediation: "Referenciar entidad.campo existentes en los contratos (o actualizar el contrato)."

- id: GOV-QLT-013
  title: Reglas derivadas a tests ejecutables
  nature: D
  category: calidad
  pillar: data_quality
  severity: MEDIUM
  technique: path
  enforcement: [pr, gate]
  scope: repo
  stages: *ops_high
  requires: {artifact: quality_rules}
  source: {doc: 08-data-quality-framework.md, section: "§26", quote: "Esta ficha de Data Quality de Producto de Datos luego debe derivarse a reglas ejecutables."}
  kb: [KB_08, KB_18]
  check: {kind: plugin, name: quality.executable_tests}
  remediation: "Implementar las reglas como dbt tests, Great Expectations o tests en tests/data_quality/."

- id: GOV-QLT-014
  title: Reglas de negocio fuera de Bronze
  nature: H
  category: calidad
  pillar: data_quality
  severity: LOW
  technique: schema
  enforcement: [pr]
  requires: {artifact: quality_rules}
  source: {doc: 08-data-quality-framework.md, section: "§10.1", quote: "No se espera aquí la validación completa del negocio."}
  kb: [KB_08, KB_06]
  check: {kind: plugin, name: quality.layer_fit}
  semantic_question: "¿Las reglas definidas en Bronze se limitan a esquema, recepción, volumen y parsing?"
  remediation: "Mover validaciones de negocio a Silver/Gold."

- id: GOV-QLT-015
  title: Umbrales adecuados al uso del producto
  nature: S
  category: calidad
  pillar: data_quality
  severity: HIGH
  technique: llm
  enforcement: [pr]
  source: {doc: 08-data-quality-framework.md, section: "§6", quote: "la calidad no se evalúa en abstracto. Se evalúa en función del uso solicitado."}
  kb: [KB_08]
  semantic_question: "¿Los umbrales y severidades son coherentes con el consumo declarado (ejecutivo, operacional, AI) y la criticidad?"
  remediation: "Recalibrar umbrales con Business Owner y Data Steward."

- id: GOV-QLT-016
  title: Gestión de incidentes de calidad
  nature: O
  category: calidad
  pillar: data_quality
  severity: MEDIUM
  technique: human
  enforcement: [runtime]
  source: {doc: 08-data-quality-framework.md, section: "§22", quote: "detección, clasificación, evaluación de impacto, contención, remediación, comunicación, causa raíz, mejora preventiva"}
  kb: [KB_08, KB_17]
  remediation: "Operar el flujo de incidentes y registrar causa raíz y cierre."

- id: GOV-QLT-017
  title: Controles de calidad para features AI
  nature: H
  category: calidad
  pillar: data_quality
  severity: HIGH
  technique: schema
  enforcement: [pr, gate]
  stages: *from_build
  when: [{dp: spec.type, equals: ai_ml}]
  source: {doc: 08-data-quality-framework.md, section: "§10.5, §19", quote: "consistencia batch / online, ausencia de leakage, completitud de features críticas"}
  kb: [KB_08, KB_15]
  check: {kind: plugin, name: quality.ai_controls}
  semantic_question: "¿Las ventanas temporales de las features evitan leakage respecto del target?"
  remediation: "Agregar reglas de completitud en capa feature y controles de leakage."

# =====================================================================================================
# SEC · SEGURIDAD, PRIVACIDAD Y COMPLIANCE  (01 §13-§14; 10-data-security-framework)
# =====================================================================================================
- id: GOV-SEC-001
  title: Clasificación de seguridad explícita
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: BLOCKER
  technique: schema
  enforcement: [pre-commit, pr, gate, catalog]
  stages: {ideacion: HIGH}
  source: {doc: 10-data-security-framework.md, section: "§10", quote: "No puede existir Data Product sin clasificación explícita."}
  kb: [KB_10]
  check: {kind: field, target: data_product, path: spec.classification.level, assert: {enum: [publico, interno, confidencial, sensible_pii]}}
  remediation: "Declarar spec.classification.level ∈ {publico, interno, confidencial, sensible_pii} según la regulación del país."

- id: GOV-SEC-002
  title: Atributos de clasificación explícitos
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: schema
  enforcement: [pr, gate]
  stages: {ideacion: MEDIUM}
  source: {doc: 10-data-security-framework.md, section: "§10 Campos recomendados", quote: "presencia de PII sí/no, ... datos financieros ..., exposición a terceros ..., retención especial ..., política de masking sí/no"}
  kb: [KB_10]
  check:
    kind: field
    target: data_product
    fields:
      spec.classification.pii: {type: boolean}
      spec.classification.financial: {type: boolean}
      spec.classification.third_party_exposure: {type: boolean}
      spec.classification.masking_required: {type: boolean}
      spec.classification.special_retention: {type: boolean}
  remediation: "Declarar explícitamente cada atributo como true/false."

- id: GOV-SEC-003
  title: PII ⇒ clasificación sensible y masking
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: BLOCKER
  technique: schema
  enforcement: [pre-commit, pr, gate]
  source: {doc: 10-data-security-framework.md, section: "§11, §15", quote: "Si el uso no requiere el dato sensible en forma completa, debe evaluarse una forma de minimización o protección."}
  kb: [KB_10]
  check: {kind: plugin, name: security.pii_coherence}
  remediation: "Con pii: true → level: sensible_pii y masking_required: true."

- id: GOV-SEC-004
  title: Privacy Impact Assessment completado antes de producción
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: BLOCKER
  technique: schema
  enforcement: [gate]
  stages: *gate_blocker
  source: {doc: 01-data-principles.md, section: "§13", quote: "Todo Data Product debe completar un Privacy Impact Assessment (PIA) antes de producción"}
  kb: [KB_10]
  check: {kind: field, target: data_product, fields: {spec.privacy.pia.status: {enum: [completado, no_aplica]}, spec.privacy.pia.reference: {not_placeholder: true}}}
  remediation: "Completar el PIA y registrar estado y referencia en spec.privacy.pia."

- id: GOV-SEC-005
  title: Política de acceso declarada
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: schema
  enforcement: [pr, gate]
  stages: *from_design
  source: {doc: 10-data-security-framework.md, section: "§12", quote: "Ningún Data Product debe depender de accesos manuales informales o no auditables."}
  kb: [KB_10]
  check:
    kind: field
    target: data_product
    fields:
      spec.access.model: {enum: [rbac, abac]}
      spec.access.level: {enum: [abierto_corporativo_controlado, restringido_dominio, restringido_rol, restringido_necesidad]}
  remediation: "Declarar modelo (rbac/abac) y nivel de acceso."

- id: GOV-SEC-006
  title: Sin secretos ni credenciales hardcodeadas
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: BLOCKER
  technique: ast
  enforcement: [pre-commit, pr]
  source: {doc: 10-data-security-framework.md, section: "§23", quote: "no hardcodear credenciales ... usar mecanismos seguros para secretos"}
  kb: [KB_10, KB_18]
  check: {kind: plugin, name: security.secrets_scan}
  remediation: "Rotar la credencial expuesta, eliminarla del historial y leerla desde Secrets Manager."

- id: GOV-SEC-007
  title: Campos con apariencia de PII sin marcar
  nature: H
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: regex
  enforcement: [pr]
  requires: {artifact: contracts_all}
  source: {doc: 10-data-security-framework.md, section: "§11", quote: "customer identity, contacto y atributos personales, loyalty accounts..."}
  kb: [KB_10]
  check: {kind: plugin, name: security.pii_column_names}
  semantic_question: "Para cada campo señalado, ¿contiene realmente un dato personal identificable o identificador indirecto?"
  remediation: "Marcar pii: true + técnica de masking, o documentar por qué no es PII."

- id: GOV-SEC-008
  title: Datos de muestra sin PII real
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: regex
  enforcement: [pre-commit, pr]
  source: {doc: 10-data-security-framework.md, section: "§11, §28", quote: "limitación de uso en ambientes no productivos ... no proteger datos sensibles en ambientes no productivos"}
  kb: [KB_10]
  check: {kind: plugin, name: security.pii_in_samples}
  remediation: "Reemplazar por datos sintéticos o enmascarados; si fue publicado, tratar como incidente de seguridad."

- id: GOV-SEC-009
  title: Exposición a terceros gobernada
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: graph
  enforcement: [pr, gate]
  source: {doc: 10-data-security-framework.md, section: "§17", quote: "Ninguna integración externa relevante debe depender solo de confianza implícita"}
  kb: [KB_10, KB_14]
  check: {kind: plugin, name: security.third_party}
  remediation: "Con exposición a terceros: contrato de salida + spec.access.third_party.{auth, recipients}."

- id: GOV-SEC-010
  title: RLS en consumo BI de datos sensibles
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: graph
  enforcement: [pr, gate]
  stages: *from_design
  source: {doc: 10-data-security-framework.md, section: "§18", quote: "row-level security, column-level security, separación por negocio / país / unidad de negocio"}
  kb: [KB_10, KB_12]
  check: {kind: plugin, name: security.rls_required}
  remediation: "Declarar spec.access.rls: true e implementar RLS en la serving/semantic layer."

- id: GOV-SEC-011
  title: Derecho al olvido en productos con PII
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: MEDIUM
  technique: schema
  enforcement: [pr, gate]
  stages: *from_design
  when: [{dp: spec.classification.pii, equals: true}]
  source: {doc: 10-data-security-framework.md, section: "§24", quote: "politicas de derecho al olvido a nivel de registros personales"}
  kb: [KB_10]
  check: {kind: field, target: data_product, path: spec.retention.right_to_be_forgotten, assert: {not_placeholder: true}}
  remediation: "Documentar el procedimiento de supresión por titular (spec.retention.right_to_be_forgotten)."

- id: GOV-SEC-012
  title: Campos PII del contrato con técnica de protección
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: schema
  enforcement: [pre-commit, pr]
  requires: {artifact: contracts_all}
  source: {doc: 10-data-security-framework.md, section: "§15", quote: "masking dinámico, masking estático, tokenización, hashing, seudonimización"}
  kb: [KB_10, KB_05]
  check: {kind: plugin, name: security.contract_pii_fields}
  remediation: "Declarar masking ∈ {dynamic, static, tokenization, hashing, pseudonymization, encryption, redaction} y clasificación sensible_pii."

- id: GOV-SEC-013
  title: Vistas de consumo no exponen PII sin enmascarar
  nature: H
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: regex
  enforcement: [pr]
  requires: {glob: ["publishing/**/*.sql", "modeling/dbt/models/semantic/**/*.sql", "src/semantic/**/*.sql"]}
  source: {doc: 10-data-security-framework.md, section: "§16.4, §18", quote: "protección frente a exposición indirecta de atributos"}
  kb: [KB_10, KB_12]
  check: {kind: plugin, name: security.views_expose_pii}
  semantic_question: "¿La vista necesita el dato personal completo para su propósito, o puede minimizarse?"
  remediation: "Aplicar función de masking/hash o excluir la columna de la vista publicada."

- id: GOV-SEC-014
  title: Validación automatizada de seguridad en CI/CD
  nature: D
  category: seguridad
  pillar: security_privacy
  severity: MEDIUM
  technique: regex
  enforcement: [pr, gate]
  scope: repo
  stages: {ideacion: "OFF", diseno: "OFF", gate: BLOCKER, operacion: BLOCKER, salida: "OFF"}
  source: {doc: 10-data-security-framework.md, section: "§23", quote: "No debe desplegarse un Data Product a producción sin haber validado sus controles mínimos ... mediante una herramienta automatizada (ej. CI/CD)."}
  kb: [KB_10, KB_18]
  check: {kind: plugin, name: dataops.security_step}
  remediation: "Agregar un paso de seguridad al pipeline (govkit lint --profile pr, escaneo de secretos, IaC scan)."

- id: GOV-SEC-015
  title: Proporcionalidad de controles a la sensibilidad
  nature: S
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: llm
  enforcement: [pr]
  source: {doc: 10-data-security-framework.md, section: "§8, §28", quote: "diseñar seguridad tan rígida que inutilice el valor del Data Product"}
  kb: [KB_10]
  semantic_question: "¿Los controles declarados (acceso, masking, RLS, exposición) son proporcionales a la sensibilidad y criticidad, sin sobre- ni sub-protección?"
  remediation: "Ajustar los controles con Security contact y Data Owner."

- id: GOV-SEC-016
  title: Exposición indirecta de PII vía joins o filtros
  nature: S
  category: seguridad
  pillar: security_privacy
  severity: HIGH
  technique: llm
  enforcement: [pr]
  source: {doc: 10-data-security-framework.md, section: "§18", quote: "exposición de PII vía joins o dashboards"}
  kb: [KB_10, KB_12]
  semantic_question: "¿Algún modelo o vista permite reidentificar personas combinando atributos no PII (cuasi-identificadores) o filtros de baja cardinalidad?"
  remediation: "Reducir granularidad, agregar k-anonimato o restringir dimensiones."

- id: GOV-SEC-017
  title: Certificación de uso responsable (self-service)
  nature: O
  category: seguridad
  pillar: security_privacy
  severity: MEDIUM
  technique: human
  enforcement: [runtime]
  source: {doc: 01-data-principles.md, section: "§14", quote: "Los usuarios deben completar una certificación de uso responsable de datos."}
  kb: [KB_10]
  remediation: "Controlar en plataforma que solo usuarios certificados accedan a autoservicio."

- id: GOV-SEC-018
  title: Revisión periódica de accesos
  nature: O
  category: seguridad
  pillar: security_privacy
  severity: MEDIUM
  technique: human
  enforcement: [periodic]
  source: {doc: 10-data-security-framework.md, section: "§12", quote: "revisión periódica, revocación oportuna"}
  kb: [KB_10]
  remediation: "Ejecutar recertificación de accesos por Owner de país."

# =====================================================================================================
# IAM · ROLES & POLICIES POR DATA PRODUCT  (lineamiento IAM - Roles & Policies)
# =====================================================================================================
- id: GOV-IAM-001
  title: 1 rol + 2 policies (data + infra) por producto
  nature: D
  category: iam
  pillar: security_privacy
  severity: HIGH
  technique: path
  enforcement: [pr]
  scope: repo
  stages: *from_build
  source: {doc: lineamientos/iam-roles-policies.md, section: "Principio General", quote: "Cada producto de datos tiene 1 rol IAM y 2 policies IAM (data + infra)."}
  kb: [KB_11]
  check: {kind: plugin, name: iam.files_present}
  remediation: "Versionar roles.json, policy-data.json y policy-infra.json del producto."

- id: GOV-IAM-002
  title: Tamaño de policy ≤ 6144 caracteres
  nature: D
  category: iam
  pillar: security_privacy
  severity: BLOCKER
  technique: threshold
  enforcement: [pre-commit, pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "¿Por qué 2 policies?", quote: "AWS tiene un límite de 6144 caracteres por managed policy."}
  kb: [KB_11]
  check: {kind: plugin, name: iam.policy_size}
  remediation: "Consolidar statements (Write+Delete sobre los mismos recursos exclusivos) o mover servicios de soporte a la policy infra."

- id: GOV-IAM-003
  title: Separación de lectura y escritura en statements
  nature: D
  category: iam
  pillar: security_privacy
  severity: HIGH
  technique: policy
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla 3", quote: "Las acciones de lectura y escritura deben ir en statements separados."}
  kb: [KB_11]
  check: {kind: plugin, name: iam.rw_separation}
  remediation: "Dividir en `{Servicio}Read` (Get/List/Describe) y `{Servicio}Write` (Put/Create/Update/Delete)."

- id: GOV-IAM-004
  title: Wildcard de escritura solo sobre recursos exclusivos
  nature: D
  category: iam
  pillar: security_privacy
  severity: BLOCKER
  technique: policy
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla 2 (la más importante)", quote: "Una acción destructiva con wildcard en un recurso compartido puede afectar múltiples productos"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.write_wildcards}
  remediation: "Usar recursos explícitos en buckets/databases compartidos; wildcard solo con prefijo exclusivo del producto."

- id: GOV-IAM-005
  title: KMS con key ID y cuenta explícitos
  nature: D
  category: iam
  pillar: security_privacy
  severity: BLOCKER
  technique: policy
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla 2 y 4", quote: "KMS Keys: Key ID explícito ... KMS keys siempre llevan account ID explícito"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.kms_explicit}
  remediation: "Reemplazar por arn:aws:kms:us-east-1:<account>:key/<key-id>."

- id: GOV-IAM-006
  title: KMS condicionado por kms:ViaService
  nature: D
  category: iam
  pillar: security_privacy
  severity: MEDIUM
  technique: policy
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla 5", quote: "Esto limita el uso de KMS keys solo cuando se accede vía S3"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.kms_via_service}
  remediation: "Agregar Condition StringEquals kms:ViaService = s3.us-east-1.amazonaws.com."

- id: GOV-IAM-007
  title: Región fija us-east-1 en ARNs de datos
  nature: D
  category: iam
  pillar: security_privacy
  severity: MEDIUM
  technique: regex
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla 4", quote: "La region es fija: us-east-1"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.region_fixed}
  remediation: "Fijar la región us-east-1 en ARNs de Glue, Athena y KMS."

- id: GOV-IAM-008
  title: Account ID comodín para multi-ambiente
  nature: D
  category: iam
  pillar: security_privacy
  severity: LOW
  technique: regex
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla 4", quote: "el account ID usa * para que la misma policy funcione en dev y prod sin modificación"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.account_wildcard}
  remediation: "Usar `*` como account ID salvo en KMS y roles cross-account."

- id: GOV-IAM-009
  title: Sin acciones comodín globales
  nature: D
  category: iam
  pillar: security_privacy
  severity: HIGH
  technique: policy
  enforcement: [pre-commit, pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Reglas de Seguridad", also: "10-data-security-framework.md §8 (least privilege)"}
  kb: [KB_11, KB_10]
  check: {kind: plugin, name: iam.action_wildcards}
  remediation: "Enumerar las acciones necesarias (least privilege)."

- id: GOV-IAM-010
  title: Trust policy limitada a servicios autorizados
  nature: D
  category: iam
  pillar: security_privacy
  severity: HIGH
  technique: policy
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_role}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Estructura del Role", quote: "Define qué servicios AWS pueden asumirlo."}
  kb: [KB_11]
  check: {kind: plugin, name: iam.trust_principals}
