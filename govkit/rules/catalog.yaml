# =====================================================================================================
#  CATÁLOGO DE REGLAS DE GOBERNANZA — "Rules as Code"
#  Fuente única de verdad del Sistema de Gobernanza Híbrido (motor determinista + KB semántica).
#
#  Cada regla declara:
#    nature      D = Determinista (AST / regex / schema / grafo / diff) · H = Híbrida (presencia D + adecuación S)
#                S = Semántica (LLM local + KB, consultiva)            · O = Organizacional (revisión humana)
#    severity    severidad base (BLOCKER > HIGH > MEDIUM > LOW > INFO). Equivalencia DQ (08 §13):
#                crítica→BLOCKER · alta→HIGH · media→MEDIUM · baja→LOW
#    stages      escalamiento por grupo de ciclo de vida (rules/registry/lifecycle.yaml) — OFF = no se evalúa
#    enforcement pre-commit · pr · gate · catalog · periodic · runtime
#    source      documento + sección + cita normativa (trazabilidad regla → lineamiento)
#    kb          mini-contextos que explican la regla (remediación asistida / revisión semántica)
#    check       declarativo (exists|field|each|count|filename|regex_scan|composite) o plugin|post
# =====================================================================================================
version: 1
ruleset_version: "2026.09.1"
framework: "Cencosud Data & AI Discipline Framework"

# Perfiles de escalamiento reutilizables (grupos: ideacion, diseno, desarrollo, gate, operacion, salida)
profiles:
  gate_blocker: &gate_blocker {ideacion: "OFF", diseno: LOW, desarrollo: MEDIUM, gate: BLOCKER, operacion: BLOCKER, salida: LOW}
  draft_ok:     &draft_ok     {ideacion: LOW, diseno: MEDIUM}   # borradores tolerados antes de desarrollo
  build_up:     &build_up     {ideacion: "OFF", diseno: MEDIUM, desarrollo: HIGH, gate: BLOCKER, operacion: BLOCKER, salida: LOW}
  design_up:    &design_up    {ideacion: LOW, diseno: MEDIUM, desarrollo: HIGH, gate: HIGH, operacion: HIGH, salida: LOW}
  ops_high:     &ops_high     {ideacion: "OFF", diseno: "OFF", desarrollo: LOW, gate: HIGH, operacion: HIGH, salida: "OFF"}
  from_design:  &from_design  {ideacion: "OFF", salida: LOW}
  from_build:   &from_build   {ideacion: "OFF", diseno: "OFF", salida: LOW}
  run_only:     &run_only     {ideacion: "OFF", diseno: "OFF", desarrollo: "OFF", gate: "OFF", salida: "OFF"}
  iam_build:    &iam_build    {ideacion: LOW, diseno: MEDIUM}   # la infraestructura se exige desde desarrollo

# Artefactos lógicos → globs (sobrescribibles por repo en .govkit.yaml → artifacts)
artifacts:
  data_product: [metadata/catalog/data_product.yaml, metadata/catalog/data_product.yml, metadata/data_product.yaml]
  glossary: [metadata/catalog/glossary.yaml, metadata/glossary.yaml]
  openmetadata: [metadata/catalog/openmetadata.yaml, metadata/openmetadata.yaml]
  scorecard: [metadata/catalog/scorecard.yaml]
  features: ["metadata/catalog/ai/features*.yaml"]
  training_sets: ["metadata/catalog/ai/training*.yaml"]
  inference: ["metadata/catalog/ai/inference*.yaml"]
  rag: ["metadata/catalog/ai/rag*.yaml"]
  dimensions: ["metadata/catalog/semantic/dimensions*.yaml"]
  quality_rules: ["quality/expectations/*.yaml", "quality/expectations/*.yml", metadata/data_quality.yaml]
  contracts_output: ["contracts/output/**/*.yaml", "contracts/output/**/*.yml"]
  contracts_input: ["contracts/input/**/*.yaml", "contracts/input/**/*.yml"]
  contracts_interface: ["contracts/input/**/*.yaml", "contracts/input/**/*.yml", "contracts/output/**/*.yaml", "contracts/output/**/*.yml"]
  contracts_gold: ["contracts/gold/**/*.yaml", "contracts/gold/**/*.yml"]
  contracts_all: ["contracts/bronze/**/*.yaml", "contracts/silver/**/*.yaml", "contracts/gold/**/*.yaml",
                  "contracts/semantic/**/*.yaml", "contracts/input/**/*.yaml", "contracts/output/**/*.yaml",
                  "contracts/**/*.yml"]
  monitors: ["observability/alarms/**/*.yaml", "observability/alarms/**/*.yml"]
  health: ["observability/health*.yaml", "observability/alarms/health*.yaml"]
  dbt_yml: ["modeling/dbt/models/**/*.yml", "modeling/dbt/models/**/*.yaml"]
  asl: ["pipelines/orchestration/step_function/**/*.json"]
  iam_role: ["**/roles.json"]
  iam_policy_data: ["**/policy-data.json"]
  iam_policy_infra: ["**/policy-infra.json"]
  use_cases: ["**/use_cases/*.yaml", "**/use_cases/*.yml"]
  omd_access_roles: ["**/roles.json"]
  omd_env_policies: ["**/*omdata-policy*.json"]
  omd_ingestion: ["**/*.yaml", "**/*.yml"]
  framework_docs: ["**/*.md"]
  portfolio_dps: ["**/metadata/catalog/data_product.yaml"]

rules:
# =====================================================================================================
# STR · ESTRUCTURA DE REPOSITORIO  (Estructura de Repositorio; 15-dataops-cicd §13-§14, §23)
# =====================================================================================================
- id: GOV-STR-001
  title: Carpetas raíz estándar del repositorio
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: HIGH
  technique: path
  enforcement: [pr]
  scope: repo
  source: {doc: lineamientos/estructura-repositorio.md, section: "Importante", quote: "Los nombres de carpetas y su propósito son fijos y no deben modificarse."}
  kb: [KB_18]
  check: {kind: exists, all: [".github/workflows/", contracts/, docs/, metadata/, modeling/, observability/, pipelines/, publishing/, quality/, shared/, src/, tests/]}
  remediation: "Crear la carpeta faltante (con .gitkeep si aún está vacía) o regenerar el esqueleto con `govkit init`."

- id: GOV-STR-002
  title: Subcarpetas estándar (contracts, docs, tests, src, pipelines)
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: path
  enforcement: [pr]
  scope: repo
  stages: {ideacion: LOW}
  source: {doc: lineamientos/estructura-repositorio.md, section: "Detalle por Carpeta"}
  kb: [KB_18]
  check:
    kind: exists
    all: [contracts/bronze/, contracts/silver/, contracts/gold/dim/, contracts/gold/fact/, contracts/semantic/, contracts/input/,
          contracts/output/, contracts/policies/, docs/adr/, docs/architecture/, docs/dbdiagram/, docs/engineering/,
          tests/contract/, tests/data_quality/, tests/integration/, tests/smoke/, tests/unit/, pipelines/orchestration/step_function/,
          src/bronze/, src/silver/, src/gold/, src/semantic/, src/common/triggers/]
  remediation: "Completar la estructura estándar; las carpetas vacías se versionan con .gitkeep."

- id: GOV-STR-003
  title: Archivos raíz obligatorios (README.md, CODEOWNERS)
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: HIGH
  technique: path
  enforcement: [pr]
  scope: repo
  source: {doc: lineamientos/estructura-repositorio.md, section: "Archivos Raíz"}
  kb: [KB_18]
  check: {kind: exists, all: [README.md, CODEOWNERS]}
  remediation: "Agregar README.md (propósito, owners, branches) y CODEOWNERS (revisión obligatoria por carpeta)."

- id: GOV-STR-004
  title: Workflows CI/CD pr.yml y deploy.yml
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: HIGH
  technique: path
  enforcement: [pr]
  scope: repo
  stages: {ideacion: MEDIUM}
  source: {doc: lineamientos/estructura-repositorio.md, section: ".github/workflows/"}
  kb: [KB_18]
  check: {kind: exists, all: [.github/workflows/pr.yml, .github/workflows/deploy.yml]}
  remediation: "Agregar los workflows usando los reusable workflows de `base-workflows`."

- id: GOV-STR-005
  title: Carpetas raíz no estándar
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: LOW
  technique: path
  enforcement: [pr]
  scope: repo
  source: {doc: lineamientos/estructura-repositorio.md, section: "Importante"}
  kb: [KB_18]
  check: {kind: plugin, name: structure.unknown_top_level}
  remediation: "Mover el contenido a la carpeta estándar correspondiente o documentar la excepción con ADR + waiver."

- id: GOV-STR-006
  title: CHANGELOG.md del producto
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: path
  enforcement: [pr]
  scope: repo
  stages: {ideacion: "OFF", diseno: LOW}
  source: {doc: 15-dataops-cicd.md, section: "§14, §23", quote: "Componentes recomendados: README.md, CHANGELOG.md, CODEOWNERS..."}
  kb: [KB_18]
  check: {kind: exists, all: [CHANGELOG.md]}
  remediation: "Agregar CHANGELOG.md (formato Keep a Changelog) alineado a las versiones semánticas del producto."

- id: GOV-STR-007
  title: README con secciones mínimas
  nature: H
  category: estructura
  pillar: product_definition
  severity: MEDIUM
  technique: regex
  enforcement: [pr]
  scope: repo
  requires: {glob: ["README.md"]}
  source: {doc: 15-dataops-cicd.md, section: "§23", quote: "propósito del producto de datos, inputs y outputs, owners, SLA, runbook..."}
  kb: [KB_18, KB_04]
  check: {kind: plugin, name: structure.readme_sections}
  semantic_question: "¿El README explica el propósito de negocio del Data Product de forma comprensible para un consumidor no técnico?"
  remediation: "Agregar secciones: Propósito, Owners, Inputs/Outputs, SLA, Branches/flujo de trabajo, Runbook."

- id: GOV-STR-008
  title: Runbook operativo
  nature: D
  category: estructura
  pillar: observability_operations
  severity: HIGH
  technique: path
  enforcement: [pr, gate]
  scope: repo
  stages: *ops_high
  source: {doc: 15-dataops-cicd.md, section: "§23", quote: "Un producto de datos sin runbook básico ni ownership visible no está listo para operación enterprise."}
  kb: [KB_18, KB_17]
  check: {kind: exists, complete: true, any: ["docs/engineering/runbook*.md", "docs/engineering/**/runbook*.md", "docs/runbook*.md"]}
  remediation: "Crear docs/engineering/runbook.md: contactos, SLA, dependencias, fallas típicas, reproceso, rollback."

- id: GOV-STR-009
  title: Proyecto dbt completo
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: path
  enforcement: [pr]
  scope: repo
  when: [{exists: "modeling/dbt/models/**/*.sql"}]
  source: {doc: lineamientos/estructura-repositorio.md, section: "modeling/"}
  kb: [KB_18, KB_07]
  check: {kind: exists, all: [modeling/dbt/dbt_project.yml, modeling/dbt/profiles.yml, modeling/dbt/requirements.txt]}
  remediation: "Agregar dbt_project.yml, profiles.yml (targets Glue/Iceberg) y requirements.txt (dbt-glue)."

- id: GOV-STR-010
  title: Definiciones Step Functions válidas
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: HIGH
  technique: schema
  enforcement: [pre-commit, pr]
  requires: {artifact: asl}
  source: {doc: lineamientos/estructura-repositorio.md, section: "pipelines/", quote: "La orquestación principal del producto se define como Step Functions."}
  kb: [KB_18]
  check: {kind: plugin, name: structure.asl_valid}
  remediation: "Corregir la definición ASL: StartAt debe existir en States y todo Next debe apuntar a un estado definido."

- id: GOV-STR-011
  title: Formato de ADRs
  nature: D
  category: estructura
  pillar: product_definition
  severity: LOW
  technique: regex
  enforcement: [pr]
  requires: {glob: ["docs/adr/*.md"]}
  source: {doc: lineamientos/estructura-repositorio.md, section: "docs/", quote: "Toda decisión técnica significativa ... debe documentarse como un ADR en docs/adr/."}
  kb: [KB_18]
  check: {kind: plugin, name: structure.adr_format}
  remediation: "Nombrar NNNN-titulo.md e incluir Contexto, Decisión y Consecuencias."

- id: GOV-STR-012
  title: Modelo lógico/físico documentado (DBML)
  nature: D
  category: estructura
  pillar: product_definition
  severity: MEDIUM
  technique: path
  enforcement: [pr]
  scope: repo
  stages: *from_design
  source: {doc: lineamientos/estructura-repositorio.md, section: "docs/dbdiagram"}
  kb: [KB_07]
  check: {kind: exists, complete: true, any: ["docs/dbdiagram/*.dbml", "docs/dbdiagram/**/*.dbml"]}
  remediation: "Versionar el modelo lógico y físico en docs/dbdiagram/*.dbml."

- id: GOV-STR-013
  title: Artefactos YAML/JSON sintácticamente válidos
  nature: D
  category: estructura
  pillar: dataops_cicd
  severity: BLOCKER
  technique: schema
  enforcement: [pre-commit, pr]
  source: {doc: 15-dataops-cicd.md, section: "§16", quote: "Un PR debería validar, como mínimo: linting..."}
  kb: [KB_18]
  check: {kind: plugin, name: structure.syntax}
  remediation: "Corregir la sintaxis en la línea indicada; un artefacto que no parsea deja sin efecto el resto de validaciones."

# =====================================================================================================
# NAM · NOMENCLATURA
# =====================================================================================================
- id: GOV-NAM-001
  title: Nombre de repositorio {domain}-{subdomain}-{type}-dp-{country}
  nature: D
  category: nomenclatura
  pillar: dataops_cicd
  severity: HIGH
  technique: regex
  enforcement: [pr]
  scope: repo
  source: {doc: lineamientos/estructura-repositorio.md, section: "Convención de nombre del repositorio", quote: "Ejemplo: product-master-txd-dp-cl"}
  kb: [KB_18]
  check: {kind: plugin, name: naming.repo_name}
  remediation: "Renombrar el repositorio (ej. `sales-transactions-anl-dp-cl`) o fijar `repo_name` en .govkit.yaml si el remoto difiere."

- id: GOV-NAM-002
  title: Dominio del repositorio registrado
  nature: D
  category: nomenclatura
  pillar: metadata_governance
  severity: HIGH
  technique: graph
  enforcement: [pr]
  scope: repo
  source: {doc: 01-data-principles.md, section: "§7", quote: "Los límites de dominio de datos son definidos y mantenidos por el Data Council corporativo."}
  kb: [KB_03]
  check: {kind: plugin, name: naming.repo_domain}
  remediation: "Usar un dominio canónico (rules/registry/domains.yaml) o solicitar su alta al Data Council."

- id: GOV-NAM-003
  title: Nomenclatura de Glue jobs
  nature: D
  category: nomenclatura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: regex
  enforcement: [pre-commit, pr]
  source: {doc: lineamientos/estructura-repositorio.md, section: "src/ · Regla de nomenclatura de jobs", quote: "job_{zone}_{env}_{domain}_{name}_{granularity}.py"}
  kb: [KB_18]
  check:
    kind: filename
    patterns: [{glob: "src/**/glue/*.py", regex: '^job_(brz|slv|gld|smt)_(dev|stg|qa|prd)_[a-z0-9]+_[a-z0-9_]+\.py$', convention: "job_{zone}_{env}_{domain}_{name}_{granularity}.py"}]
  remediation: "Renombrar el job, p.ej. `job_slv_prd_txd_arts_odm_dbt_decoupling.py`."

- id: GOV-NAM-004
  title: Nomenclatura de Lambdas
  nature: D
  category: nomenclatura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: regex
  enforcement: [pre-commit, pr]
  source: {doc: lineamientos/estructura-repositorio.md, section: "src/ · Regla de nomenclatura de lambdas", quote: "lambda_{zone}_{env}_{domain}_{name}.py"}
  kb: [KB_18]
  check:
    kind: filename
    patterns: [{glob: "src/**/lambda/*.py", regex: '^lambda_(brz|slv|gld|smt)_(dev|stg|qa|prd)_[a-z0-9]+_[a-z0-9_]+\.py$', convention: "lambda_{zone}_{env}_{domain}_{name}.py"}]
  remediation: "Renombrar la lambda, p.ej. `lambda_slv_prd_txd_sync_config_dynamo.py`."

- id: GOV-NAM-005
  title: Modelos Gold dbt dim_* / fact_*
  nature: D
  category: nomenclatura
  pillar: product_definition
  severity: MEDIUM
  technique: regex
  enforcement: [pre-commit, pr]
  source: {doc: lineamientos/estructura-repositorio.md, section: "modeling/ · models/gold", quote: "dim_*.sql → Dimensiones · fact_*.sql → Tablas de hechos"}
  kb: [KB_07]
  check:
    kind: filename
    patterns: [{glob: "modeling/dbt/models/gold/**/*.sql", regex: '^(dim|fact)_[a-z0-9_]+\.sql$', convention: "dim_<entidad>.sql | fact_<proceso>.sql"}]
  remediation: "Renombrar el modelo Gold con prefijo dim_ (dimensión) o fact_ (hecho)."

- id: GOV-NAM-006
  title: Contratos Gold ubicados según tipo (dim/fact)
  nature: D
  category: nomenclatura
  pillar: data_contract
  severity: LOW
  technique: regex
  enforcement: [pr]
  source: {doc: lineamientos/estructura-repositorio.md, section: "contracts/gold/dim · contracts/gold/fact"}
  kb: [KB_05]
  check:
    kind: filename
    patterns:
      - {glob: "contracts/gold/dim/*.y*ml", regex: '^dim_[a-z0-9_]+\.ya?ml$', convention: "contracts/gold/dim/dim_*.yaml"}
      - {glob: "contracts/gold/fact/*.y*ml", regex: '^fact_[a-z0-9_]+\.ya?ml$', convention: "contracts/gold/fact/fact_*.yaml"}
  remediation: "Mover el contrato a la subcarpeta que corresponde a su tipo."

- id: GOV-NAM-007
  title: Convención de ramas <tipo>/<dominio>/<descripcion>
  nature: D
  category: nomenclatura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: regex
  enforcement: [pr]
  scope: repo
  source: {doc: lineamientos/estructura-repositorio.md, section: "Convención de branches", quote: "<tipo>/<dominio>/<descripcion-corta>"}
  kb: [KB_18]
  check: {kind: plugin, name: naming.branch}
  remediation: "Crear la rama como `feat/<dominio>/<descripcion>` (feat|fix|hotfix|chore)."

- id: GOV-NAM-008
  title: Conventional Commits
  nature: D
  category: nomenclatura
  pillar: dataops_cicd
  severity: MEDIUM
  technique: regex
  enforcement: [pr]
  scope: repo
  source: {doc: 15-dataops-cicd.md, section: "§20", quote: "El mensaje del commit describe el tipo de cambio y gatilla la regla de versionamiento"}
  kb: [KB_18, KB_05]
  check: {kind: plugin, name: naming.commits}
  remediation: "Usar `tipo(scope): descripción`; `!` o `BREAKING CHANGE:` para cambios MAJOR."

- id: GOV-NAM-009
  title: Nombre del rol IAM cencosud-role-{repo}
  nature: D
  category: nomenclatura
  pillar: security_privacy
  severity: HIGH
  technique: regex
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_role}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Convención de Nombres", quote: "Role: cencosud-role-{github-dp-name}"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.naming_role}
  remediation: "Renombrar RoleName a `cencosud-role-<nombre-del-repo>`."

- id: GOV-NAM-010
  title: Nombres de policies cencosud-policy-{repo}-data|infra
  nature: D
  category: nomenclatura
  pillar: security_privacy
  severity: HIGH
  technique: regex
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_role}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Convención de Nombres"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.naming_policies}
  remediation: "Nombrar las policies `cencosud-policy-<repo>-data` y `cencosud-policy-<repo>-infra` y adjuntarlas al rol."

- id: GOV-NAM-011
  title: Buckets del lakehouse cencosud-{pais}-dlk-{zona}-{dominio}-*
  nature: D
  category: nomenclatura
  pillar: security_privacy
  severity: MEDIUM
  technique: regex
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Policy DATA · Ejemplo", quote: "arn:aws:s3:::cencosud-pe-dlk-brz-{domain}-*"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.bucket_naming}
  remediation: "Referenciar buckets del lakehouse con el patrón corporativo (el aislamiento por nombre sustenta la regla de wildcard)."

- id: GOV-NAM-012
  title: Databases Glue dlk_{zona}_{pais}_{dominio}_{nombre}
  nature: D
  category: nomenclatura
  pillar: security_privacy
  severity: MEDIUM
  technique: regex
  enforcement: [pr]
  stages: *iam_build
  requires: {artifact: iam_policy_data}
  source: {doc: lineamientos/iam-roles-policies.md, section: "Regla de Wildcard", quote: "Database Glue exclusiva (dlk_brz_pe_cus_raw)"}
  kb: [KB_11]
  check: {kind: plugin, name: iam.glue_db_naming}
  remediation: "Usar databases con patrón dlk_{zona}_{pais}_{dominio}_{nombre}."

- id: GOV-NAM-013
  title: Nombre del Data Product en kebab-case
  nature: D
  category: nomenclatura
  pillar: metadata_governance
  severity: LOW
  technique: regex
  enforcement: [pr]
  source: {doc: 09-metadata-governance.md, section: "§16"}
  kb: [KB_09]
  check: {kind: field, target: data_product, path: metadata.name, assert: {regex: '^[a-z0-9]+(-[a-z0-9]+)*$'}}
  remediation: "Usar kebab-case estable (es la clave de la entidad en el catálogo)."

- id: GOV-NAM-014
  title: Campos de contratos en snake_case
  nature: D
  category: nomenclatura
  pillar: data_contract
  severity: LOW
  technique: regex
  enforcement: [pre-commit, pr]
  stages: *draft_ok
  source: {doc: 06-data-product-definition.md, section: "§11"}
  kb: [KB_05]
  check: {kind: each, target: contracts_all, path: spec.schema, noun: campo, keys: {name: {regex: '^[a-z][a-z0-9_]*$'}}}
  remediation: "Renombrar el campo a snake_case (implica versión MAJOR si el contrato ya está publicado)."

# =====================================================================================================
# DPD · DEFINICIÓN DEL DATA PRODUCT  (01 §1-§2, §12; 06-data-product-definition)
# =====================================================================================================
- id: GOV-DPD-001
  title: Ficha del Data Product versionada (metadata as code)
  nature: D
  category: data_product
  pillar: product_definition
  severity: BLOCKER
  technique: path
  enforcement: [pr, gate, catalog]
  scope: repo
  source: {doc: 01-data-principles.md, section: "§3", quote: "Sin metadata registrada en el catálogo corporativo, el dato no existe para el ecosistema."}
  kb: [KB_04, KB_09]
  check: {kind: exists, any: [metadata/catalog/data_product.yaml, metadata/catalog/data_product.yml, metadata/data_product.yaml],
          message: "No existe la ficha del Data Product (metadata/catalog/data_product.yaml)"}
  remediation: "Crear metadata/catalog/data_product.yaml (plantilla en `govkit init`) — es el origen de la sincronización a OpenMetadata."

- id: GOV-DPD-002
  title: Ficha conforme al esquema canónico
  nature: D
  category: data_product
  pillar: product_definition
  severity: HIGH
