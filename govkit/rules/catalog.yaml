  kb: [KB_13, KB_14]
  check: {kind: plugin, name: consumption.platform_matrix}
  remediation: "Seleccionar la plataforma según la matriz 14 §14 (ver rules/registry/consumption_matrix.yaml)."

- id: GOV-CNS-004
