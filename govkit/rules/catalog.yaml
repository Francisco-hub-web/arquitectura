  check: {kind: plugin, name: consumption.certified_sources}
  remediation: "Alimentar el producto solo con inputs type: data_product (maestros certificados)."

- id: GOV-CNS-005
  title: API operacional sobre serving operacional
  nature: D
  category: consumo
  pillar: data_contract
  severity: HIGH
  technique: graph
  enforcement: [pr]
  source: {doc: 14-data-consumption-exploitation-framework.md, section: "§10.5", quote: "Queda estrictamente prohibido que las APIs consuman directamente capas de almacenamiento analítico pesado"}
  kb: [KB_14]
  check: {kind: plugin, name: consumption.api_serving}
  remediation: "Interponer una Serving Layer operacional (Redis, DynamoDB, PostgreSQL indexado)."

- id: GOV-CNS-006
