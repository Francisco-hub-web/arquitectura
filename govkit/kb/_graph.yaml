  iam_policies:              {label: "Diseñar rol y policies IAM",                        core: [KB_11],               plus: [KB_10]}
  exponer_consumo:           {label: "Exponer consumo (BI, API, export, reverse ETL)",    core: [KB_13, KB_14],        plus: [KB_12, KB_10]}
  feature_ml:                {label: "Definir features para ML",                          core: [KB_15],               plus: [KB_08, KB_10, KB_17]}
  entrenar_modelo:           {label: "Dataset de entrenamiento / modelo",                 core: [KB_15],               plus: [KB_08, KB_17]}
