apiVersion: cencosud.data/v1
kind: DataContract
metadata:
  name: sales_line_daily
  version: 1.0.0
  data_product: DP-SAL-TRANSACTIONS-CL-001
  domain: sales
  owner: jorge.munoz@cencosud.com
  description: "Hecho diario de ventas por línea de ticket (Gold) publicado para la Semantic Layer Comercial Chile."
spec:
  direction: output
  layer: gold
  producer: DP-SAL-TRANSACTIONS-CL-001
  granularity: "línea de ticket por día de negocio"
  business_keys: [ticket_id, line_number]
  format: [iceberg]
  schema:
    - {name: ticket_id, type: string, required: true, description: "Identificador único del ticket (POS o pedido e-commerce)", pii: false}
    - {name: line_number, type: integer, required: true, description: "Posición de la línea dentro del ticket", pii: false}
    - {name: business_date, type: date, required: true, description: "Día de negocio de la venta (zona America/Santiago)", pii: false}
    - {name: store_id, type: string, required: true, description: "Código de tienda (dominio Store Operations)", pii: false}
    - {name: sku_id, type: string, required: true, description: "Código SKU (dominio Product)", pii: false}
    - {name: sales_channel_id, type: string, required: true, description: "Canal de venta conformado (dim_sales_channel)", pii: false}
    - {name: units, type: "decimal(18,3)", required: true, description: "Unidades vendidas; negativas en devoluciones", pii: false}
    - {name: net_amount_clp, type: "decimal(18,2)", required: true, description: "Monto neto en CLP sin IVA, después de descuentos", pii: false}
  sla: {frequency: diaria, freshness: PT24H, availability: "99.5%"}
  quality:
    - {rule: ticket_line_unica, dimension: unicidad, threshold: "< 0.1%"}
  classification: confidencial
  compatibility: backward
  change_policy:
    breaking_changes: major_version_and_notice
    notice_days: 30
    notification_channel: "#dp-sales-transactions-cl"
  consumers: ["Semantic Layer Comercial Chile"]
